<style>
:root {
  --bg:#0f0f0f; --surface:#161616; --surface2:#1c1c1c; --border:#2a2a2a;
  --accent:#f0956a; --text:#e8e4e0; --muted:#6a6560;
  --run:#f0956a; --strength:#7eb8d4; --long:#c49a6c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}

.app{display:flex;flex-direction:column;height:100dvh;height:100vh;max-width:430px;margin:0 auto;overflow:hidden}

/* HEADER */
.hdr{padding:16px 20px 14px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between}
.hdr-label{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.hdr-goal{font-size:46px;font-weight:900;line-height:1;color:var(--accent)}
.hdr-goal span{font-size:17px;font-weight:400;color:var(--muted);margin-left:4px}
.today-badge{background:var(--accent);color:#fff;font-family:monospace;font-size:10px;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:.05em;margin-top:4px}

/* TABS */
.tabs-wrap{overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:7px;width:max-content}
.tab{font-family:monospace;font-size:11px;color:var(--muted);padding:5px 11px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;transition:all .15s;white-space:nowrap;position:relative}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.tab.cur:not(.active){border-color:var(--accent);color:var(--accent)}
.tab.cur::after{content:'';width:5px;height:5px;background:var(--accent);border-radius:50%;position:absolute;top:-2px;right:-2px;box-shadow:0 0 0 2px var(--bg)}
.tab.active.cur::after{background:#fff}

/* SLIDER */
.slider-wrap{flex:1;overflow:hidden;position:relative}
.slider{display:flex;height:100%;transition:transform .33s cubic-bezier(.4,0,.2,1);will-change:transform}
.panel{min-width:100%;height:100%;overflow-y:auto;padding-bottom:90px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}

/* WEEK HEADER sticky */
.wk-hdr{padding:16px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border)}
.wk-num{font-size:64px;font-weight:900;line-height:1;color:var(--surface2);position:absolute;right:14px;bottom:6px;letter-spacing:-.04em;pointer-events:none;user-select:none}
.wk-label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.wk-phase{color:var(--accent);margin-left:6px;letter-spacing:.12em}
.wk-dates{font-size:20px;font-weight:700;position:relative;z-index:1}
.wk-focus{font-family:monospace;font-size:10px;color:var(--accent);letter-spacing:.06em;position:relative;z-index:1;text-align:right;padding-bottom:3px;max-width:160px}

/* CURRENT WEEK BANNER */
.cur-banner{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:8px 12px;background:rgba(240,149,106,.08);border:1px solid rgba(240,149,106,.22);border-radius:8px}
.cur-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
.cur-text{font-family:monospace;font-size:10px;color:var(--accent);letter-spacing:.1em}

/* DAY CARDS */
.days{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px;position:relative;overflow:hidden;transition:border-color .15s,background .15s,opacity .15s}
.card.today{border-color:var(--accent);background:rgba(240,149,106,.07)}
.card.today::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:10px 0 0 10px}
.card.past:not(.today){opacity:.42}
.card.done .day-title{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.55}
.card-inner{display:flex;align-items:flex-start;gap:11px}
.type-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;margin-top:2px}
.type-dot.run{background:rgba(240,149,106,.14)}
.type-dot.fast{background:rgba(240,149,106,.14)}
.type-dot.long{background:rgba(196,154,108,.14)}
.type-dot.strength{background:rgba(126,184,212,.14)}
.type-dot.rest{background:rgba(255,255,255,.04)}
.day-info{flex:1;min-width:0}
.name-row{display:flex;align-items:center;gap:7px;margin-bottom:2px;flex-wrap:wrap}
.day-name{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day-date{font-family:monospace;font-size:10px;color:var(--muted)}
.today-tag{font-family:monospace;font-size:9px;font-weight:700;background:var(--accent);color:#fff;padding:2px 6px;border-radius:3px;letter-spacing:.05em}
.day-title{font-size:16px;font-weight:700;line-height:1.2;margin-bottom:3px}
.day-title.rc{color:var(--run)}
.day-title.lc{color:var(--long)}
.day-title.sc{color:var(--strength)}
.metrics{margin-bottom:3px}
.met{display:inline-flex;align-items:center;gap:3px;margin-right:10px;font-size:10px;font-family:monospace}
.met strong{color:var(--text);font-weight:600}
.notes{margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-size:11px;font-family:monospace;color:var(--muted);line-height:1.55}

/* CHECKBOX */
.cb{flex-shrink:0;width:24px;height:24px;border:1.5px solid var(--border);border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s,transform .1s;margin-top:3px;user-select:none;-webkit-user-select:none}
.cb:active{transform:scale(.82)}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on::after{content:'';display:block;width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(42deg) translate(-1px,-1px)}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;padding:10px 18px;background:linear-gradient(to top,var(--bg) 55%,transparent);display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:20}
.arrow{font-family:monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;pointer-events:all;cursor:pointer;padding:8px;user-select:none}
.arrow:active{color:var(--accent)}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .2s;pointer-events:all;cursor:pointer}
.dot.on{background:var(--accent);width:15px;border-radius:3px}

/* TOAST */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:monospace;font-size:11px;padding:7px 15px;border-radius:6px;z-index:100;transition:transform .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;letter-spacing:.05em}
.toast.show{transform:translateX(-50%) translateY(0)}

// ── STORAGE (bulletproof for content:// URLs) ────────────────────────────────
const SK = 'rich5k-v3';
let _mem = {};
function _get() {
  try { return JSON.parse(localStorage.getItem(SK) || '{}'); }
  catch(e) { return _mem; }
}
function _set(v) {
  try { localStorage.setItem(SK, JSON.stringify(v)); }
  catch(e) { _mem = v; }
}
function isDone(w, d)  { return !!_get()[w+'-'+d]; }
function toggle(w, d)  {
  var c = _get(), k = w+'-'+d;
  if (c[k]) delete c[k]; else c[k] = true;
  _set(c);
  return !!c[k];
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
var today = new Date();
function addD(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmt(d)  { return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); }
function fmtS(d) { return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}).toUpperCase(); }
function fmtW(d) { return d.toLocaleDateString('en-GB', {weekday:'short'}).toUpperCase(); }
function same(a, b)   { return a.toDateString() === b.toDateString(); }
function before(a, b) {
  var x = new Date(a); x.setHours(0,0,0,0);
  var y = new Date(b); y.setHours(0,0,0,0);
  return x < y;
}
function icon(t) {
  return {run:'🏃', fast:'⚡', long:'🏃', strength:'💪', rest:'🌙'}[t] || '·';
}
function findToday() {
  for (var w = 0; w < WEEKS.length; w++)
    for (var d = 0; d < 7; d++)
      if (same(addD(START, w*7+d), today)) return {w:w, d:d};
  return null;
}

// ── STATE ────────────────────────────────────────────────────────────────────
var CUR = 0;

// ── BUILD ────────────────────────────────────────────────────────────────────
function build() {
  var hit = findToday();
  CUR = hit ? hit.w : 0;
  document.getElementById('todayBadge').textContent = fmtW(today) + ' ' + fmtS(today);
  buildTabs(hit);
  buildPanels(hit);
  buildDots();
  slide(CUR, false);
}

function buildTabs(hit) {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  WEEKS.forEach(function(w, i) {
    var b = document.createElement('button');
    var cls = 'tab';
    if (i === CUR) cls += ' active';
    if (hit && hit.w === i) cls += ' cur';
    b.className = cls;
    b.textContent = 'W' + (i+1) + ' · ' + w.label;
    b.onclick = (function(idx){ return function(){ go(idx); }; })(i);
    el.appendChild(b);
  });
}

function buildPanels(hit) {
  var sl = document.getElementById('slider');
  sl.innerHTML = '';
  WEEKS.forEach(function(w, wi) {
    var ws = addD(START, wi*7);
    var we = addD(START, wi*7+6);
    var isNow = hit && hit.w === wi;

    var panel = document.createElement('div');
    panel.className = 'panel';

    // sticky week header
    var hdr = document.createElement('div');
    hdr.className = 'wk-hdr';
    hdr.innerHTML =
      '<div>' +
        '<div class="wk-label">WEEK ' + (wi+1) + ' <span class="wk-phase">' + w.label + '</span></div>' +
        '<div class="wk-dates">' + fmt(ws) + ' – ' + fmt(we) + '</div>' +
      '</div>' +
      '<div style="position:relative;z-index:1;text-align:right">' +
        '<div class="wk-focus">' + w.focus + '</div>' +
      '</div>' +
      '<div class="wk-num">' + String(wi+1).padStart(2,'0') + '</div>';
    panel.appendChild(hdr);

    // current week banner
    if (isNow) {
      var banner = document.createElement('div');
      banner.className = 'cur-banner';
      banner.innerHTML = '<div class="cur-dot"></div><span class="cur-text">CURRENT WEEK</span>';
      panel.appendChild(banner);
    }

    // day cards
    var list = document.createElement('div');
    list.className = 'days';

    w.days.forEach(function(d, di) {
      var date   = addD(START, wi*7+di);
      var isT    = same(date, today);
      var isPast = before(date, today);
      var done   = isDone(wi, di);

      var card = document.createElement('div');
      var cc = 'card';
      if (isT)           cc += ' today';
      if (isPast && !isT) cc += ' past';
      if (done)          cc += ' done';
      card.className = cc;

      var colClass = {run:'rc', fast:'rc', long:'lc', strength:'sc'}[d.t] || '';
      var mets = '';
      if (d.km)   mets += '<span class="met"><strong>' + d.km + 'km</strong></span>';
      if (d.pace) mets += '<span class="met"><strong>' + d.pace + '</strong></span>';
      if (d.rpe)  mets += '<span class="met">' + d.rpe + '</span>';

      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="type-dot ' + d.t + '">' + icon(d.t) + '</div>' +
          '<div class="day-info">' +
            '<div class="name-row">' +
              '<span class="day-name">' + date.toLocaleDateString('en-GB',{weekday:'long'}) + '</span>' +
              '<span class="day-date">' + fmt(date) + '</span>' +
              (isT ? '<span class="today-tag">TODAY</span>' : '') +
            '</div>' +
            '<div class="day-title ' + colClass + '">' + d.title + '</div>' +
            (mets ? '<div class="metrics">' + mets + '</div>' : '') +
            (d.notes ? '<div class="notes">' + d.notes + '</div>' : '') +
          '</div>' +
          '<div class="cb' + (done ? ' on' : '') + '" data-wi="' + wi + '" data-di="' + di + '" role="checkbox" aria-checked="' + done + '" aria-label="Mark complete"></div>' +
        '</div>';

      // checkbox tap
      var cb = card.querySelector('.cb');
      cb.addEventListener('click', function(e) {
        e.stopPropagation();
        var wi2 = parseInt(this.getAttribute('data-wi'));
        var di2 = parseInt(this.getAttribute('data-di'));
        var now2 = toggle(wi2, di2);
        this.classList.toggle('on', now2);
        this.setAttribute('aria-checked', now2);
        this.parentElement.parentElement.classList.toggle('done', now2);
        showToast(now2 ? '✓ Session logged' : 'Unmarked');
      });

      list.appendChild(card);
    });

    panel.appendChild(list);
    sl.appendChild(panel);
  });
}

function buildDots() {
  var el = document.getElementById('dots');
  el.innerHTML = '';
  WEEKS.forEach(function(_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === CUR ? ' on' : '');
    d.onclick = (function(idx){ return function(){ go(idx); }; })(i);
    el.appendChild(d);
  });
}

function slide(idx, anim) {
  if (anim === undefined) anim = true;
  var sl = document.getElementById('slider');
  if (!anim) sl.style.transition = 'none';
  sl.style.transform = 'translateX(-' + (idx * 100) + '%)';
  if (!anim) requestAnimationFrame(function(){ sl.style.transition = ''; });

  document.querySelectorAll('.tab').forEach(function(t, i){ t.classList.toggle('active', i===idx); });
  document.querySelectorAll('.dot').forEach(function(d, i){ d.classList.toggle('on', i===idx); });

  // scroll active tab into view
  var tabs = document.getElementById('tabs');
  var tab  = tabs.children[idx];
  if (tab) {
    var wrap = tabs.parentElement;
    wrap.scrollTo({ left: tab.offsetLeft - (wrap.clientWidth - tab.offsetWidth)/2, behavior:'smooth' });
  }

  // scroll today card or top of panel
  var panels = document.querySelectorAll('.panel');
  var panel  = panels[idx];
  if (panel) {
    var tc = panel.querySelector('.today');
    if (tc) { setTimeout(function(){ tc.scrollIntoView({behavior:'smooth', block:'center'}); }, 360); }
    else panel.scrollTo({top:0, behavior:'smooth'});
  }
}

function go(i) {
  if (i < 0 || i >= WEEKS.length) return;
  CUR = i;
  slide(CUR);
}
function navigate(dir) { go(CUR + dir); }

// ── SWIPE ────────────────────────────────────────────────────────────────────
var tx = 0, ty = 0, sw = false;
var swWrap = document.getElementById('sliderWrap');
swWrap.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; sw = false; }, {passive:true});
swWrap.addEventListener('touchmove',  function(e){ var dx=e.touches[0].clientX-tx, dy=e.touches[0].clientY-ty; if(!sw && Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>8) sw=true; }, {passive:true});
swWrap.addEventListener('touchend',   function(e){ if(sw && Math.abs(e.changedTouches[0].clientX-tx)>50) navigate(e.changedTouches[0].clientX<tx?1:-1); sw=false; });

document.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft') navigate(-1); if(e.key==='ArrowRight') navigate(1); });

// ── TOAST ────────────────────────────────────────────────────────────────────
var _tt;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

// ── INIT ─────────────────────────────────────────────────────────────────────
build();
if (today < START) {
  var daysUntil = Math.ceil((START - today) / 86400000);
  setTimeout(function(){ showToast('Plan starts in ' + daysUntil + ' day' + (daysUntil !== 1 ? 's' : '') + ' · 25 May'); }, 700);
}
