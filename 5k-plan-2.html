<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5K Plan">
<title>5K Training Plan · Sub 18:59</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #161616;
  --surface2: #1c1c1c;
  --border: #2a2a2a;
  --accent: #f0956a;
  --text: #e8e4e0;
  --muted: #6a6560;
  --run: #f0956a;
  --strength: #7eb8d4;
  --long: #c49a6c;
  --fd: 'Barlow Condensed', sans-serif;
  --fm: 'IBM Plex Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Barlow Condensed',sans-serif; }

/* APP */
.app { display:flex; flex-direction:column; height:100dvh; height:100vh; max-width:430px; margin:0 auto; overflow:hidden; }

/* HEADER */
.hdr { padding:52px 20px 14px; background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:10; }
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; }
.hdr-label { font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
.hdr-goal { font-size:46px; font-weight:900; line-height:1; color:var(--accent); }
.hdr-goal span { font-size:17px; font-weight:400; color:var(--muted); margin-left:4px; }
.today-badge { background:var(--accent); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:500; padding:4px 10px; border-radius:4px; letter-spacing:.05em; margin-top:4px; }

/* TABS */
.tabs-wrap { overflow-x:auto; padding:11px 18px; background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.tabs-wrap::-webkit-scrollbar { display:none; }
.tabs { display:flex; gap:7px; width:max-content; }
.tab { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); padding:5px 11px; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer; transition:all .15s; white-space:nowrap; position:relative; }
.tab.active { color:#fff; background:var(--accent); border-color:var(--accent); }
.tab.cur:not(.active) { border-color:var(--accent); color:var(--accent); }
.tab.cur::after { content:''; width:5px; height:5px; background:var(--accent); border-radius:50%; position:absolute; top:-2px; right:-2px; box-shadow:0 0 0 2px var(--bg); }
.tab.active.cur::after { background:#fff; }

/* SLIDER */
.slider-wrap { flex:1; overflow:hidden; position:relative; }
.slider { display:flex; height:100%; transition:transform .33s cubic-bezier(.4,0,.2,1); will-change:transform; }
.panel { min-width:100%; height:100%; overflow-y:auto; padding-bottom:90px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.panel::-webkit-scrollbar { display:none; }

/* WEEK HEADER (sticky) */
.wk-hdr { padding:18px 18px 11px; display:flex; align-items:flex-end; justify-content:space-between; position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid var(--border); }
.wk-num { font-size:68px; font-weight:900; line-height:1; color:var(--surface2); position:absolute; right:14px; bottom:7px; letter-spacing:-.04em; pointer-events:none; user-select:none; }
.wk-label { font-size:11px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
.wk-phase { color:var(--accent); margin-left:6px; letter-spacing:.12em; }
.wk-dates { font-size:21px; font-weight:700; position:relative; z-index:1; }
.wk-focus { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--accent); letter-spacing:.08em; position:relative; z-index:1; text-align:right; padding-bottom:3px; }

/* CURRENT WEEK BANNER */
.cur-banner { display:flex; align-items:center; gap:8px; margin:11px 16px 0; padding:8px 13px; background:rgba(240,149,106,.08); border:1px solid rgba(240,149,106,.22); border-radius:8px; }
.cur-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.65)} }
.cur-text { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--accent); letter-spacing:.1em; }

/* DAY LIST */
.days { padding:10px 14px; display:flex; flex-direction:column; gap:7px; }

/* DAY CARD */
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 13px; position:relative; overflow:hidden; transition:border-color .15s, background .15s, opacity .15s; }
.card.today { border-color:var(--accent); background:rgba(240,149,106,.07); }
.card.today::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); border-radius:10px 0 0 10px; }
.card.past:not(.today) { opacity:.42; }
.card.done .day-title { text-decoration:line-through; text-decoration-color:var(--muted); opacity:.55; }

.card-inner { display:flex; align-items:flex-start; gap:11px; }
.type-dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px; margin-top:2px; }
.type-dot.run      { background:rgba(240,149,106,.14); }
.type-dot.long     { background:rgba(196,154,108,.14); }
.type-dot.strength { background:rgba(126,184,212,.14); }
.type-dot.rest     { background:rgba(255,255,255,.04); }

.day-info { flex:1; min-width:0; }
.name-row { display:flex; align-items:center; gap:7px; margin-bottom:2px; }
.day-name { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.day-date { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); }
.today-tag { font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:500; background:var(--accent); color:#fff; padding:2px 6px; border-radius:3px; letter-spacing:.05em; }
.day-title { font-size:17px; font-weight:700; line-height:1.2; margin-bottom:3px; }
.day-title.rc { color:var(--run); }
.day-title.lc { color:var(--long); }
.day-title.sc { color:var(--strength); }
.metrics { margin-bottom:3px; }
.met { display:inline-flex; align-items:center; gap:3px; margin-right:10px; font-size:10px; font-family:'IBM Plex Mono',monospace; }
.met strong { color:var(--text); font-weight:500; }
.notes { margin-top:7px; padding-top:7px; border-top:1px solid var(--border); font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--muted); line-height:1.55; }

/* CHECKBOX */
.cb { flex-shrink:0; width:24px; height:24px; border:1.5px solid var(--border); border-radius:50%; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .18s, border-color .18s, transform .1s; margin-top:3px; user-select:none; -webkit-user-select:none; }
.cb:active { transform:scale(.82); }
.cb.on { background:var(--accent); border-color:var(--accent); }
.cb.on::after { content:''; display:block; width:5px; height:9px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(42deg) translate(-1px,-1px); }

/* BOTTOM NAV */
.nav { position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto; padding:10px 18px; background:linear-gradient(to top,var(--bg) 55%,transparent); display:flex; justify-content:space-between; align-items:center; pointer-events:none; z-index:20; }
.arrow { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.1em; pointer-events:all; cursor:pointer; padding:8px; user-select:none; }
.arrow:active { color:var(--accent); }
.dots { display:flex; gap:5px; align-items:center; }
.dot { width:5px; height:5px; border-radius:50%; background:var(--border); transition:all .2s; pointer-events:all; cursor:pointer; }
.dot.on { background:var(--accent); width:15px; border-radius:3px; }

/* TOAST */
.toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-80px); background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:11px; padding:7px 15px; border-radius:6px; z-index:100; transition:transform .25s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; letter-spacing:.05em; }
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-row">
      <div>
        <div class="hdr-label">5K Target</div>
        <div class="hdr-goal">18:59<span>goal</span></div>
      </div>
      <div class="today-badge" id="todayBadge">– –</div>
    </div>
  </div>
  <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
  <div class="slider-wrap" id="sliderWrap">
    <div class="slider" id="slider"></div>
  </div>
  <div class="nav">
    <div class="arrow" onclick="navigate(-1)">← PREV</div>
    <div class="dots" id="dots"></div>
    <div class="arrow" onclick="navigate(1)">NEXT →</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const START = new Date(2026,4,25); // Mon 25 May

const P = { easy:'5:45–6:15/km', tempo:'3:58–4:10/km', interval:'3:40–3:50/km', long:'5:30–6:00/km', race:'3:47/km avg' };

const WEEKS = [
  // ── W1 BASE · 26 May – 1 Jun ────────────────────────────────────────────
  { label:'BASE', focus:'Easy aerobic introduction', days:[
    { t:'strength', title:'Strength A',       notes:'Squats 3×6, Romanian DL 3×6, Glute bridge 3×10, Calf raises 3×12, Hip flexor stretch. Very light — just waking the muscles up.' },
    { t:'run',      title:'Easy Run',          km:4,  pace:P.easy,  rpe:'RPE 4',   notes:'Super easy first run. No targets. Conversational pace the whole way. Focus on relaxed breathing and upright posture.' },
    { t:'run',      title:'Easy Run',          km:5,  pace:P.easy,  rpe:'RPE 4',   notes:'Same easy effort as Tuesday. Keep cadence high (~170 spm) and arms relaxed. No watch pressure.' },
    { t:'strength', title:'Strength B',        notes:'Split squat 3×6 each, Single-leg DL 3×6, Plank 3×30s, Band clamshells 3×12. Technique first — weight is secondary.' },
    { t:'rest',     title:'Rest',              notes:'Full rest. Sleep 8h if you can — recovery is as important as the sessions in week 1.' },
    { t:'long',     title:'Long Run',          km:7,  pace:P.long,  rpe:'RPE 4',   notes:'First long run — keep it easy and enjoyable. Time on feet, not pace. Bring water.' },
    { t:'rest',     title:'Rest',              notes:'Full rest. Stretch quads and calves. Note any niggles.' },
  ]},
  // ── W2 BASE ─────────────────────────────────────────────────────────────
  { label:'BASE', focus:'Build comfort + introduce strides', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 3×8, Romanian DL 3×8, Glute bridge 3×12, Calf raises 3×15. Slight increase in reps vs W1.' },
    { t:'run',      title:'Easy Run',          km:5,  pace:P.easy,  rpe:'RPE 4–5', notes:'Aerobic base. End with 4×15s strides (fast but relaxed, not a sprint) with full recovery. First taste of speed.' },
    { t:'run',      title:'Easy Run',          km:6,  pace:P.easy,  rpe:'RPE 4–5', notes:'Steady aerobic effort. Z2 heart rate throughout. No pushing.' },
    { t:'strength', title:'Strength B',        notes:'Split squat 3×8, Single-leg DL 3×8, Box jump 3×4, Side plank 3×25s each. Introduce the box jumps lightly.' },
    { t:'rest',     title:'Rest',              notes:'Active rest OK — short walk, gentle yoga, swimming. No running.' },
    { t:'long',     title:'Long Run',          km:8,  pace:P.long,  rpe:'RPE 4–5', notes:'8km easy. Pick a scenic route to make it enjoyable. Gel optional at 40 min.' },
    { t:'rest',     title:'Rest',              notes:'Rest and refuel. Protein-rich meal. Foam roll if legs feel heavy.' },
  ]},
  // ── W3 BASE ─────────────────────────────────────────────────────────────
  { label:'BASE', focus:'Consolidate base + first structured session', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 3×10, Romanian DL 3×10, Hip thrust 3×10, Calf raises 3×18. Start feeling the pattern — these lifts protect your running.' },
    { t:'run',      title:'Easy Run',          km:5,  pace:P.easy,  rpe:'RPE 4–5', notes:'Pure aerobic. End with 4×20s strides with 60s walk recovery. Focus on quick turnover, relaxed jaw.' },
    { t:'run',      title:'Fartlek',           km:7,  pace:'Mixed', rpe:'RPE 5–7', notes:'2km easy WU → 15 min fartlek (30s faster / 60s easy, repeat) → 2km CD. Unstructured and playful — first quality session.' },
    { t:'strength', title:'Strength B',        notes:'Split squat 3×10, Single-leg DL 3×8, Box jump 3×5, Plank 3×40s, Copenhagen plank 2×20s each. Add Copenhagen plank for adductor strength.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Three solid weeks in — take this seriously. Legs need it.' },
    { t:'long',     title:'Long Run',          km:9,  pace:P.long,  rpe:'RPE 4–5', notes:'9km at easy effort. Notice your form over the last 2km — are you maintaining posture? Good sign of aerobic fitness building.' },
    { t:'rest',     title:'Rest',              notes:'Full rest. W4 introduces real quality work — arrive fresh.' },
  ]},
  // ── W4 BUILD ────────────────────────────────────────────────────────────
  { label:'BUILD', focus:'Introduce threshold + track work', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 4×8, Romanian DL 4×8, Plyometric lunge 3×5, Hip thrust 3×12. Start adding explosive lower body work.' },
    { t:'run',      title:'Easy Run',          km:6,  pace:P.easy,  rpe:'RPE 4–5', notes:'Z2 aerobic. End with 4×20s strides. Legs may feel a little flat — that\'s fine.' },
    { t:'run',      title:'Track Intervals',   km:7,  pace:P.interval, rpe:'RPE 8', notes:'2km WU → 5×400m at goal 5K pace (3:47/km) w/ 90s standing rest → 1km CD. First proper speed work — controlled, not all-out.' },
    { t:'strength', title:'Strength B',        notes:'Single-leg squat 3×8, Nordic hamstring curl 3×4, Jump squat 3×5, Copenhagen plank 3×20s each. Introduce Nordic curls carefully.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Track intervals + strength in same week — respect the load.' },
    { t:'long',     title:'Long Run',          km:10, pace:P.long,  rpe:'RPE 4–5', notes:'First double-digit long run. Keep it honest and easy. Take a gel at 45 min. Finish feeling like you had more in the tank.' },
    { t:'rest',     title:'Rest',              notes:'Full rest. Good week — the training is beginning to stack.' },
  ]},
  // ── W5 BUILD ────────────────────────────────────────────────────────────
  { label:'BUILD', focus:'Threshold development', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 4×8 (slightly heavier), Romanian DL 4×8, Plyometric lunge 3×6, Hip thrust 3×12. Progressive overload week.' },
    { t:'run',      title:'Easy Run',          km:6,  pace:P.easy,  rpe:'RPE 4–5', notes:'Aerobic base. Keep it genuinely easy — Wednesday is a hard day.' },
    { t:'run',      title:'Threshold Run',     km:8,  pace:P.tempo, rpe:'RPE 7–8', notes:'2km WU → 4km continuous at threshold (comfortably hard, can say a few words) → 2km CD. First sustained threshold effort — key session.' },
    { t:'strength', title:'Strength B',        notes:'Single-leg squat 3×10, Nordic 3×5, Jump lunge 3×5 each, Copenhagen plank 3×25s. Incrementing reps and difficulty.' },
    { t:'rest',     title:'Rest',              notes:'Rest. The threshold run is taxing — don\'t underestimate it.' },
    { t:'long',     title:'Long Run',          km:11, pace:P.long,  rpe:'RPE 4–5', notes:'11km easy. Longest run yet. Carry water. Last km can be slightly quicker if you feel good — notice the aerobic gains.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Two more hard weeks ahead. Eat well and sleep.' },
  ]},
  // ── W6 BUILD (PEAK) ─────────────────────────────────────────────────────
  { label:'BUILD', focus:'Peak volume + 5K pace work', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 4×6 (heaviest week), Romanian DL 4×6, Depth jump 3×4, Hip thrust 3×15. Highest strength load of the block.' },
    { t:'run',      title:'Easy Run',          km:7,  pace:P.easy,  rpe:'RPE 4–5', notes:'Easy aerobic. The 5K intervals on Wednesday are the priority — protect them with an honest easy day today.' },
    { t:'run',      title:'5K Pace Intervals', km:9,  pace:P.interval, rpe:'RPE 8–9', notes:'2km WU → 5×1km at goal 5K pace (3:47/km) w/ 2 min jog rest → 2km CD. The key session of the whole block. This is where sub-19 is built.' },
    { t:'strength', title:'Strength B',        notes:'Single-leg DL 3×10, Nordic 3×5, Lateral band walk 3×20, Jump lunge 3×5 each. Sub-max effort — don\'t empty the tank.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Peak week. The 5×1km + long run in one week is serious training load. Let it absorb.' },
    { t:'long',     title:'Long Run',          km:12, pace:P.long,  rpe:'RPE 4–5', notes:'Peak long run — 12km easy. Legs will be tired. Stick to easy pace and focus on good form throughout. Gel at 50 min.' },
    { t:'rest',     title:'Rest',              notes:'Full rest. Peak week done. Excellent work.' },
  ]},
  // ── W7 CONSOLIDATE ──────────────────────────────────────────────────────
  { label:'CONSOLIDATE', focus:'Absorb peak load, hold fitness', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 3×8 (same weight as W6), Romanian DL 3×8, Box jump 3×4. Volume down ~25%, intensity maintained.' },
    { t:'run',      title:'Easy Run',          km:6,  pace:P.easy,  rpe:'RPE 4',   notes:'Easy and comfortable. Legs may feel heavy after peak week — that\'s adaptation. Keep it slow.' },
    { t:'run',      title:'Tempo Intervals',   km:8,  pace:P.tempo, rpe:'RPE 7',   notes:'2km WU → 3×1.5km tempo w/ 2 min jog → 1km CD. Maintain threshold fitness from W5–6 without adding new load.' },
    { t:'strength', title:'Strength B',        notes:'Single-leg squat 3×8, Nordic 3×4, Copenhagen plank 3×25s, Calf raise 3×18. Brief and quality.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Consolidation week is about absorbing, not adding. Trust the process.' },
    { t:'long',     title:'Long Run',          km:10, pace:P.long,  rpe:'RPE 4–5', notes:'10km easy. Slightly shorter than peak — intentional. Run this feeling controlled and relaxed. You should feel stronger than week 5.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Three weeks to race day. From here the volume comes down, the sharpness stays.' },
  ]},
  // ── W8 SHARPEN ──────────────────────────────────────────────────────────
  { label:'SHARPEN', focus:'Speed stays, volume drops', days:[
    { t:'strength', title:'Strength A',        notes:'Squats 3×6, Romanian DL 3×6, Box jump 3×4. Volume down 30% from peak, intensity same. These sessions protect you, not build you now.' },
    { t:'run',      title:'Easy Run',          km:5,  pace:P.easy,  rpe:'RPE 4',   notes:'Short and easy. Body is absorbing the build block. You may feel surprisingly good — that\'s the fitness coming through.' },
    { t:'run',      title:'Mixed Intervals',   km:8,  pace:'Mixed', rpe:'RPE 7–9', notes:'2km WU → 2×1km at tempo + 4×200m faster-than-5K pace w/ 90s rest → 1.5km CD. Sharpen the neuromuscular system.' },
    { t:'strength', title:'Strength B',        notes:'Split squat 3×6, Nordic 3×4, Jump lunge 3×4 each. Short and purposeful — 25 mins max.' },
    { t:'rest',     title:'Rest',              notes:'Rest. Two weeks to race day. Trust the fitness you\'ve built.' },
    { t:'long',     title:'Medium-Long Run',   km:9,  pace:P.long,  rpe:'RPE 4–5', notes:'Last real long run. 9km easy — last 2km can drift slightly faster if it feels natural. Nothing forced.' },
    { t:'rest',     title:'Rest',              notes:'Rest. One week to race day. Trust the fitness you\'ve built.' },
  ]},
  // ── W9 RACE WEEK · 21–27 Jul · RACE SAT 25 JUL ─────────────────────────
  { label:'RACE', focus:'Arrive fresh — sub 18:59 · Sat 25 Jul', days:[
    { t:'strength', title:'Light Activation',  notes:'Squats 2×5, Glute bridge 2×10, Calf raise 2×10. 15 mins only. Just priming the system — nothing that creates fatigue.' },
    { t:'run',      title:'Easy Run',          km:4,  pace:P.easy,    rpe:'RPE 4',    notes:'Short and easy. May feel sluggish — classic taper fatigue. Don\'t panic, it means your body is resting up. Trust it.' },
    { t:'run',      title:'Sharpener',         km:4,  pace:'Strides', rpe:'RPE 7',    notes:'1.5km WU easy → 4×100m strides at race pace with full recovery → 1.5km CD. Done in 30 mins. Just to feel sharp and quick.' },
    { t:'rest',     title:'Rest',              notes:'Rest — Thu 24 Jul. 2 days out. Carb-focused meals today and tomorrow. Stay off your feet where possible.' },
    { t:'rest',     title:'Race Eve',          notes:'Fri 24 Jul — rest day. Carb-rich dinner by 7pm. No alcohol. In bed by 10pm. Kit is laid out. Vomero 18s are laced up.' },
    { t:'long',     title:'RACE DAY 🏁',       km:5,  pace:'3:47/km avg', rpe:'RPE 9–10', notes:'Sat 25 Jul. WU: 10–15 min easy jog + 4×100m strides. Splits: km1 3:52 (don\'t go out too fast!), km2 3:48, km3 3:47, km4 3:46, km5 GO. Stay tall. Drive the arms. 9 weeks of work — sub 18:59.' },
    { t:'rest',     title:'Recovery',          notes:'Sun 27 Jul. Walk only. Legs will be sore. That\'s the badge. Well done. 🎉' },
  ]},
];

// ── STORAGE ──
const SK = 'rich5k-v3';
function getC()        { try { return JSON.parse(localStorage.getItem(SK)||'{}'); } catch { return {}; } }
function isDone(w,d)   { return !!getC()[`${w}-${d}`]; }
function toggle(w,d)   { const c=getC(), k=`${w}-${d}`; if(c[k]) delete c[k]; else c[k]=true; localStorage.setItem(SK,JSON.stringify(c)); return !!c[k]; }

// ── HELPERS ──
const today = new Date();
function addD(d,n)  { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmt(d)     { return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function fmtS(d)    { return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase(); }
function fmtW(d)    { return d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase(); }
function same(a,b)  { return a.toDateString()===b.toDateString(); }
function before(a,b){ const x=new Date(a); x.setHours(0,0,0,0); const y=new Date(b); y.setHours(0,0,0,0); return x<y; }
function ICON(t)    { return {run:'⚡',long:'🏃',strength:'💪',rest:'🌙'}[t]||'·'; }

function findToday() {
  for (let w=0;w<WEEKS.length;w++) for (let d=0;d<7;d++) if (same(addD(START,w*7+d),today)) return {w,d};
  return null;
}

let CUR = 0;

// ── BUILD ──
function build() {
  const hit = findToday();
  CUR = hit ? hit.w : 0;
  document.getElementById('todayBadge').textContent = `${fmtW(today)} ${fmtS(today)}`;
  buildTabs(hit);
  buildPanels(hit);
  buildDots();
  slide(CUR, false);
}

function buildTabs(hit) {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  WEEKS.forEach((w,i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i===CUR?' active':'') + (hit&&hit.w===i?' cur':'');
    b.textContent = `W${i+1} · ${w.label}`;
    b.onclick = () => go(i);
    el.appendChild(b);
  });
}

function buildPanels(hit) {
  const sl = document.getElementById('slider');
  sl.innerHTML = '';
  WEEKS.forEach((w,wi) => {
    const ws = addD(START, wi*7);
    const we = addD(START, wi*7+6);
    const now = hit && hit.w===wi;

    const panel = document.createElement('div');
    panel.className = 'panel';

    // sticky header
    const hdr = document.createElement('div');
    hdr.className = 'wk-hdr';
    hdr.innerHTML = `
      <div>
        <div class="wk-label">Week ${wi+1} <span class="wk-phase">${w.label}</span></div>
        <div class="wk-dates">${fmt(ws)} – ${fmt(we)}</div>
      </div>
      <div style="position:relative;z-index:1;text-align:right">
        <div class="wk-focus">${w.focus}</div>
      </div>
      <div class="wk-num">${String(wi+1).padStart(2,'0')}</div>`;
    panel.appendChild(hdr);

    // current week banner
    if (now) {
      const b = document.createElement('div');
      b.className = 'cur-banner';
      b.innerHTML = `<div class="cur-dot"></div><span class="cur-text">CURRENT WEEK</span>`;
      panel.appendChild(b);
    }

    // days
    const list = document.createElement('div');
    list.className = 'days';
    w.days.forEach((d,di) => {
      const date = addD(START, wi*7+di);
      const isT  = same(date, today);
      const isPa = before(date, today);
      const done = isDone(wi, di);

      const card = document.createElement('div');
      card.className = 'card' + (isT?' today':'') + (isPa&&!isT?' past':'') + (done?' done':'');

      const col = {run:'rc',long:'lc',strength:'sc'}[d.t]||'';
      const mets = [];
      if (d.km)   mets.push(`<span class="met"><strong>${d.km}km</strong></span>`);
      if (d.pace) mets.push(`<span class="met"><strong>${d.pace}</strong></span>`);
      if (d.rpe)  mets.push(`<span class="met">${d.rpe}</span>`);

      card.innerHTML = `
        <div class="card-inner">
          <div class="type-dot ${d.t}">${ICON(d.t)}</div>
          <div class="day-info">
            <div class="name-row">
              <span class="day-name">${date.toLocaleDateString('en-GB',{weekday:'long'})}</span>
              <span class="day-date">${fmt(date)}</span>
              ${isT?'<span class="today-tag">TODAY</span>':''}
            </div>
            <div class="day-title ${col}">${d.title}</div>
            ${mets.length?`<div class="metrics">${mets.join('')}</div>`:''}
            ${d.notes?`<div class="notes">${d.notes}</div>`:''}
          </div>
          <div class="cb${done?' on':''}" data-wi="${wi}" data-di="${di}" role="checkbox" aria-checked="${done}" aria-label="Mark complete"></div>
        </div>`;

      card.querySelector('.cb').addEventListener('click', e => {
        e.stopPropagation();
        const cb = e.currentTarget;
        const now2 = toggle(+cb.dataset.wi, +cb.dataset.di);
        cb.classList.toggle('on', now2);
        cb.setAttribute('aria-checked', now2);
        card.classList.toggle('done', now2);
        showToast(now2 ? '✓ Session logged' : 'Unmarked');
      });

      list.appendChild(card);
    });

    panel.appendChild(list);
    sl.appendChild(panel);
  });
}

function buildDots() {
  const el = document.getElementById('dots');
  el.innerHTML = '';
  WEEKS.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'dot'+(i===CUR?' on':'');
    d.onclick = () => go(i);
    el.appendChild(d);
  });
}

function slide(idx, anim=true) {
  const sl = document.getElementById('slider');
  if (!anim) sl.style.transition='none';
  sl.style.transform = `translateX(-${idx*100}%)`;
  if (!anim) requestAnimationFrame(()=>sl.style.transition='');

  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===idx));

  const tabs = document.getElementById('tabs');
  const tab  = tabs.children[idx];
  if (tab) { const w=tabs.parentElement; w.scrollTo({left:tab.offsetLeft-(w.clientWidth-tab.offsetWidth)/2,behavior:'smooth'}); }

  const panels = document.querySelectorAll('.panel');
  const panel  = panels[idx];
  if (panel) {
    const tc = panel.querySelector('.today');
    if (tc) setTimeout(()=>tc.scrollIntoView({behavior:'smooth',block:'center'}),360);
    else panel.scrollTo({top:0,behavior:'smooth'});
  }
}

function go(i) { if (i<0||i>=WEEKS.length) return; CUR=i; slide(CUR); }
function navigate(dir) { go(CUR+dir); }

// ── SWIPE ──
let tx=0,ty=0,sw=false;
const wrap = document.getElementById('sliderWrap');
wrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;sw=false;},{passive:true});
wrap.addEventListener('touchmove', e=>{const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;if(!sw&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8)sw=true;},{passive:true});
wrap.addEventListener('touchend',  e=>{if(sw&&Math.abs(e.changedTouches[0].clientX-tx)>50)navigate(e.changedTouches[0].clientX<tx?1:-1);sw=false;});

document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')navigate(-1);if(e.key==='ArrowRight')navigate(1);});

// ── TOAST ──
let tt;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2000);
}

// ── INIT ──
build();
if (today < START) {
  const d=Math.ceil((START-today)/86400000);
  setTimeout(()=>showToast(`Plan starts in ${d} day${d!==1?'s':''} · 25 May`),700);
}

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  const code=`const C='rich5k-v3';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['/']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'application/javascript'}))).catch(()=>{});
}
</script>
</body>
